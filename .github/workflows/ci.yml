name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Probe sandbox capabilities
        run: |
          python - <<'PY'
          from agentsphere.sandbox import probe
          caps = probe()
          print(caps)
          print("network_isolation", caps.network_isolation)
          print("filesystem_isolation", caps.filesystem_isolation)
          PY

      - name: Run tests
        run: pytest
