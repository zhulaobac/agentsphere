[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsphere"
version = "0.1.0"
description = "AgentSphere: enterprise agent production platform kernel, runtime, sandbox, and identity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentSphere" }]
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "packaging>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
agentsphere = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
